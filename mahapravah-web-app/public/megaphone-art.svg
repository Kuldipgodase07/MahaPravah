<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Warm Gradients -->
    <linearGradient id="coneGrad" x1="60" y1="200" x2="210" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE8D6" />
      <stop offset="60%" stop-color="#FFD6B0" />
      <stop offset="100%" stop-color="#FFAB66" />
    </linearGradient>

    <linearGradient id="bellGrad" x1="170" y1="80" x2="220" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <linearGradient id="bodyStroke" x1="50" y1="220" x2="230" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="handleGrad" x1="80" y1="180" x2="130" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD6B0" />
      <stop offset="100%" stop-color="#FFAB66" />
    </linearGradient>
  </defs>

  <!-- Ambient Sound Waves / Energy Arcs -->
  <g stroke="#F56600" stroke-linecap="round" opacity="0.85">
    <!-- Wave 1 (Close) -->
    <path d="M 235 75 C 255 105 255 155 235 185" stroke-width="4.5" stroke-dasharray="3 3" />
    <!-- Wave 2 (Middle) -->
    <path d="M 258 55 C 288 95 288 165 258 205" stroke-width="5" />
    <!-- Wave 3 (Outer) -->
    <path d="M 282 38 C 320 85 320 175 282 225" stroke-width="5.5" stroke-dasharray="8 6" />

    <!-- Action / Sparkle Rays -->
    <path d="M 205 45 L 220 25" stroke-width="4.5" />
    <path d="M 245 42 L 265 28" stroke-width="4.5" />
    <path d="M 230 205 L 248 222" stroke-width="4.5" />
    <path d="M 195 210 L 205 232" stroke-width="4.5" />
  </g>

  <!-- Little Joy Dots / Sparkles -->
  <circle cx="270" cy="85" r="4.5" fill="#F56600" opacity="0.75" />
  <circle cx="288" cy="140" r="3.5" fill="#EA580C" opacity="0.7" />
  <circle cx="245" cy="165" r="4" fill="#F56600" opacity="0.8" />
  <polygon points="215,15 220,22 227,22 222,27 224,34 217,30 211,33 213,26 208,22 215,22" fill="#F56600" opacity="0.75" />

  <!-- Megaphone Body Shadow -->
  <ellipse cx="140" cy="285" rx="65" ry="12" fill="#E65100" opacity="0.12" />

  <!-- Megaphone Handle -->
  <g>
    <path d="M 102 182 L 132 256 C 134 262 129 268 123 268 L 108 268 C 103 268 98 264 96 259 L 76 195 Z" 
          fill="url(#handleGrad)" 
          stroke="#D84315" 
          stroke-width="4.5" 
          stroke-linejoin="round" />
    <path d="M 98 215 L 120 262" stroke="#E65100" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <!-- Handle Bottom Cap -->
    <rect x="94" y="263" width="34" height="7" rx="3.5" fill="#E65100" />
  </g>

  <!-- Megaphone Main Cone -->
  <path d="M 72 152 L 188 95 C 190 94 193 96 193 99 L 193 185 C 193 188 190 190 188 189 L 72 174 C 68 173 66 170 66 166 L 66 160 C 66 156 68 153 72 152 Z" 
        fill="url(#coneGrad)" 
        stroke="url(#bodyStroke)" 
        stroke-width="5" 
        stroke-linejoin="round" />

  <!-- Cone Accent Reflection / Shading Lines -->
  <path d="M 85 156 L 175 112" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <path d="M 90 168 L 172 177" stroke="#E65100" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />

  <!-- Back Audio Joint / Mouthpiece -->
  <g>
    <!-- Cap -->
    <rect x="42" y="151" width="25" height="24" rx="7" fill="#FF8A3D" stroke="#D84315" stroke-width="4.5" />
    <ellipse cx="42" cy="163" rx="5" ry="9" fill="#D84315" />
    <path d="M 48 155 L 48 171" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Big Front Bell / Flare -->
  <g>
    <ellipse cx="193" cy="142" rx="22" ry="52" fill="url(#bellGrad)" stroke="#D84315" stroke-width="5" />
    <!-- Inner Mouth Depth -->
    <ellipse cx="195" cy="142" rx="13" ry="42" fill="#BF360C" opacity="0.85" />
    <!-- Inner Core Bulb -->
    <ellipse cx="193" cy="142" rx="7" ry="18" fill="#FFB74D" stroke="#E65100" stroke-width="2.5" />
    <!-- Front Rim Highlight -->
    <path d="M 183 98 C 176 118 176 166 183 186" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- Cross-hatching Texture Accents (Preserving the Artisanal Touch) -->
  <g stroke="#E65100" stroke-width="1.8" stroke-linecap="round" opacity="0.35">
    <line x1="105" y1="150" x2="112" y2="162" />
    <line x1="115" y1="146" x2="122" y2="158" />
    <line x1="125" y1="142" x2="132" y2="154" />
    <line x1="135" y1="138" x2="142" y2="150" />
    <line x1="145" y1="134" x2="152" y2="146" />
    <line x1="155" y1="130" x2="162" y2="142" />
  </g>
</svg>
